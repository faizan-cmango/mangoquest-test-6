# testplan.yaml: counter4d (SAD 3.1) · Dayo · v1.0
block: counter4d
version: "1.0"
vps_ref: spec/counter4d/vps.yaml@v0.1
risk: LOW
targets: {line: 100, branch: 100, toggle: 100, fsm: 100, functional: 100}
formal_harness: none
coverage_dsl: v1
clock: clk
harnesses: [verif/test_counter4d.py]
scenarios:
  - id: VPS-01
    revision: 1
    slug: reset
    req_ids: [REQ-3.1.1, REQ-3.1.5]
    intent: "Run some increments, then drive rst_n to 0 at a falling edge for two rising edges; also from count 0 and from count 15."
    expected: "count is 0 after the first rising edge with rst_n 0 and stays 0 while rst_n is 0."
    covergroup: cg_vps_01
    coverpoints: {count_at: [zero, mid, max]}
    directed: test_vps_01_reset
    properties: []
  - id: VPS-02
    revision: 1
    slug: hold
    req_ids: [REQ-3.1.4]
    intent: "After reset, enable for three edges so count is 3, then drive en to 0 for several edges."
    expected: "count stays at 3 while en is 0."
    covergroup: cg_vps_02
    coverpoints: {en_state: [low_after_count]}
    directed: test_vps_02_hold
    properties: []
  - id: VPS-03
    revision: 1
    slug: increment
    req_ids: [REQ-3.1.2, REQ-3.1.8]
    intent: "After reset, drive en to 1 for one rising edge with count 0, then from a mid value."
    expected: "count becomes previous plus 1 after that edge."
    covergroup: cg_vps_03
    coverpoints: {count_at: [zero, mid]}
    directed: test_vps_03_increment
    properties: []
  - id: VPS-04
    revision: 1
    slug: wrap
    req_ids: [REQ-3.1.3]
    intent: "Count to 15 with en 1, then give one more rising edge with en 1."
    expected: "count goes from 15 to 0."
    covergroup: cg_vps_04
    coverpoints: {count_at: [max]}
    directed: test_vps_04_wrap
    properties: []
  - id: VPS-05
    revision: 1
    slug: reset_priority
    req_ids: [REQ-3.1.6, REQ-3.1.1]
    intent: "With count nonzero and en 1, drive rst_n to 0 while en stays 1."
    expected: "count is 0 after the edge and stays 0 while rst_n is 0 and en is 1."
    covergroup: cg_vps_05
    coverpoints: {en_state: [high_in_reset]}
    directed: test_vps_05_reset_priority
    properties: []
  - id: VPS-06
    revision: 1
    slug: coverage_all_values
    req_ids: [REQ-3.1.2, REQ-3.1.3]
    intent: "Run 17 enabled edges from reset so count visits every value 0 to 15 and wraps."
    expected: "count takes each value 0 to 15 and then 0 again."
    covergroup: cg_vps_06
    coverpoints: {count_at: [zero, mid, max]}
    directed: test_vps_06_coverage_all_values
    properties: []
extra_tests: [test_random_seeded]
constraint_model:
  IDD-CTRL:
    en: "0 or 1 at falling edges only, 3 edges in 4 high (R1); long en-low runs one time in 8"
    rst_n: "1 after the first two edges; asserted for 1 to 3 edges about one time in 20, at falling edges only (R1), with en random"
  illegal_inputs_excluded: ["any input change in the timestep of a rising clk edge (R1 of IDD-CTRL)"]
