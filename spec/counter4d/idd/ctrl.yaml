idd: IDD-CTRL
version: "0.1"
block: counter4d
side: slave
protocol_class: level
sad_section: "3.1"
clock: clk
reset: rst_n
ports:
  - {name: clk, dir: in, width: 1, type: logic, req: REQ-3.1.5, reset_value: n/a, meaning: "100 MHz clock; all behaviour on its rising edge"}
  - {name: rst_n, dir: in, width: 1, type: logic, req: REQ-3.1.1, reset_value: n/a, meaning: "synchronous reset, active low"}
  - {name: en, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "count enable, level"}
  - {name: count, dir: out, width: 4, type: logic, req: REQ-3.1.2, reset_value: 0, meaning: "counter value, 0 to 15"}
omitted_signals: []
rules:
  - {id: R1, holder: environment, req: REQ-3.1.8, text: "en and rst_n change only at falling clk edges, never in the timestep of a rising clk edge; the clock starts low"}
  - {id: R2, holder: block, req: REQ-3.1.7, text: "the block has exactly the ports clk, rst_n, en, count and no parameters"}
timing:
  - {req: REQ-3.1.1, clock: clk, from: "rising clk edge with rst_n 0", to: "count equal to 0", cycles: 1, text: "reset takes effect at the same edge"}
  - {req: REQ-3.1.2, clock: clk, from: "rising clk edge with rst_n 1 and en 1", to: "count incremented", cycles: 1, text: "increment visible after that edge"}
corner_cases:
  - {id: C1, req: REQ-3.1.3, text: "count 15 with en 1 and rst_n 1 goes to 0", vps: VPS-04}
  - {id: C2, req: REQ-3.1.6, text: "rst_n 0 and en 1 together: count becomes 0", vps: VPS-05}
  - {id: C3, req: REQ-3.1.4, text: "en 0: count holds at any value", vps: VPS-02}
registers: []
errata_applied: []
